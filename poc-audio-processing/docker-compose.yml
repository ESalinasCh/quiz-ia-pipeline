services:
  poc-audio-service:
    build:
      context: .
      network: host
    network_mode: host
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"]
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/cache/huggingface
      - WHISPER_CACHE_DIR=/cache/whisper
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - QDRANT_HOST=127.0.0.1
    volumes:
      - ./cache:/cache
      - ./app:/app/app
    restart: unless-stopped
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      # Securely bind database ports only to localhost (127.0.0.1)
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./cache/qdrant:/qdrant/storage
    restart: unless-stopped
