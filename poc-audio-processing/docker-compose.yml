services:
  poc-audio-service:
    build:
      context: .
      network: host
    network_mode: host
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"]
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/cache/huggingface
      - WHISPER_CACHE_DIR=/cache/whisper
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - QDRANT_HOST=127.0.0.1
    volumes:
      - ./cache:/cache
      - ./app:/app/app
    restart: unless-stopped
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      # Securely bind database ports only to localhost (127.0.0.1)
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./cache/qdrant:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      # Bind to localhost so both the host .NET app and the python service reach it at 127.0.0.1:11434
      - "127.0.0.1:11434:11434"
    volumes:
      # Persist pulled models so they are not re-downloaded on every container restart
      - ./cache/ollama:/root/.ollama
    environment:
      # 12 GB VRAM (RTX 4080 Laptop) cannot hold two LLMs at once; force one resident model + clean swap.
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=10m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
